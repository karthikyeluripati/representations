# Phase 2 pilot with the 7B rollout policy (contingency arm). Train split only.
decisions:
  split: train
  n_games: 12              # 2 per task family
  states_per_episode: 3
  candidates_per_state: 4
  n_rollouts: 4
  rollout_policy: frozen_lm
  rollout_temperature: 0.5
  dev_fraction: 0.25
  holdout_families: [pick_two_obj_and_place]
  out_dir: results/decisions_pilot7b
